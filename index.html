<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIF MOSAIC — 실시간 영상 모자이크</title><style>
:root{color-scheme:dark;font-family:system-ui,'Malgun Gothic',sans-serif}*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f3f4fc}.app{height:100dvh;min-height:550px;display:flex;flex-direction:column}.top{padding:14px 22px;display:flex;align-items:center;gap:18px;background:#111622;border-bottom:1px solid #293144;flex-wrap:wrap}.logo{font-weight:900;letter-spacing:1px;color:#b6a5ff;white-space:nowrap}.filelabel,.btn{border:1px solid #404960;background:#272e42;color:white;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.filelabel{background:#7356e6;border-color:#7356e6}.filelabel input{display:none}.filelabel:hover,.btn:hover{filter:brightness(1.16)}.hint{font-size:12px;color:#9ba5bc}.viewer{position:relative;flex:1;min-height:220px;overflow:hidden;background:#040507}.viewer canvas{display:block;width:100%;height:100%}.placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;color:#b8bfd1;padding:24px}.placeholder h1{font-size:clamp(24px,4vw,44px);color:white;margin:0 0 10px}.placeholder p{font-size:14px;line-height:1.8}.hidden{display:none!important}.pill{position:absolute;top:14px;left:14px;background:#090c15c9;border:1px solid #464c60;border-radius:30px;padding:8px 12px;font-size:12px;pointer-events:none}.controls{background:#111622;padding:14px 22px 16px;border-top:1px solid #2a3245}.seek{display:flex;align-items:center;gap:12px;margin-bottom:14px}.seek input{flex:1}.time{font-size:12px;font-variant-numeric:tabular-nums;color:#c9cfdd;min-width:45px}.settings{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.setting{display:flex;align-items:center;gap:9px;font-size:13px;color:#bfc7d7}.setting input[type=range]{width:clamp(85px,12vw,165px)}.setting strong{color:#fff;min-width:46px;font-size:12px}.spacer{flex:1}.status{font-size:12px;color:#aab4c9;padding:9px 22px;background:#0c1019;min-height:33px}input[type=range]{accent-color:#9c83ff;cursor:pointer}video{display:none}@media(max-width:650px){.top,.controls{padding:11px}.settings{gap:10px}.setting{flex-wrap:wrap}.setting input[type=range]{width:90px}.hint{display:none}.app{min-height:500px}}
</style></head><body><div class="app"><header class="top"><div class="logo">◈ GIF MOSAIC</div><label class="filelabel">📂 동영상 파일 열기<input id="file" type="file" accept="video/*"></label><span class="hint">MP4 / WebM 등 브라우저에서 지원하는 영상 · 서버 업로드 없이 내 기기에서 처리</span></header><main id="viewer" class="viewer"><canvas id="screen"></canvas><div id="placeholder" class="placeholder"><h1>움직이는 이미지 모자이크</h1><p>동영상 파일을 선택하면 화면 전체가 이미지 타일로 재생됩니다.<br>영상의 색과 움직임을 실시간으로 반영합니다.</p></div><div id="pill" class="pill hidden">모자이크 준비 중</div></main><section class="controls"><div class="seek"><button class="btn" id="play" aria-label="재생 또는 일시정지">▶</button><span class="time" id="current">0:00</span><input id="seek" aria-label="재생 위치" type="range" min="0" max="1000" value="0" step="1"><span class="time" id="duration">0:00</span></div><div class="settings"><label class="setting">🔊 음량 <input id="volume" type="range" min="0" max="100" value="65"><strong id="volumeLabel">65%</strong></label><label class="setting">▦ 이미지 개수 <input id="count" type="range" min="100" max="3000" step="50" value="900"><strong id="countLabel">900개</strong></label><label class="setting">🎨 색상 반영 <input id="blend" type="range" min="0" max="100" value="68"><strong id="blendLabel">68%</strong></label><div class="spacer"></div><button class="btn" id="full">⛶ 전체 화면</button></div></section><footer class="status" id="status">이미지 준비 중…</footer></div><video id="video" playsinline preload="auto"></video><script src="app.js"></script></body></html>
