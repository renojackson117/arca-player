<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIF MOSAIC — 영상 모자이크 플레이어</title><style>
:root{color-scheme:dark;font-family:system-ui,'Malgun Gothic',sans-serif}*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f0f3ff}.app{min-height:100vh;display:flex;flex-direction:column}.top{padding:17px 25px;display:flex;align-items:center;gap:18px;background:#111520;border-bottom:1px solid #2a3041;flex-wrap:wrap}.logo{font-weight:900;letter-spacing:2px;color:#b6a5ff;white-space:nowrap}.input{display:flex;gap:8px;flex:1;min-width:280px}.input input{width:100%;padding:12px 14px;background:#080b13;border:1px solid #3c4257;border-radius:9px;color:#fff;outline:none}.input button,.filelabel,.btn{border:1px solid #3e4761;background:#242b3e;color:#fff;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:700;white-space:nowrap}.input button{background:#7455e6;border-color:#7455e6}.filelabel input{display:none}.viewer{position:relative;flex:1;min-height:330px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#050608}.viewer canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.placeholder{position:relative;text-align:center;pointer-events:none;color:#b5b8cb}.placeholder h1{font-size:clamp(24px,4vw,44px);margin:0 0 12px}.placeholder p{font-size:14px;line-height:1.8}.hidden{display:none!important}.pill{position:absolute;top:16px;left:16px;background:#090b13bc;border:1px solid #404459;border-radius:100px;padding:8px 12px;font-size:12px;color:#ddd;pointer-events:none}.video-wrap{position:absolute;right:14px;top:14px;width:210px;aspect-ratio:16/9;border:1px solid #5a5b6a;border-radius:8px;overflow:hidden;background:#000;opacity:.92;z-index:3}.video-wrap iframe,.video-wrap video{width:100%;height:100%;border:0;object-fit:contain}.controls{background:#111520;padding:18px 25px 21px;border-top:1px solid #2a3041}.seek{display:flex;align-items:center;gap:12px;margin-bottom:16px}.seek input{flex:1}.time{font-size:12px;font-variant-numeric:tabular-nums;color:#c7c9d6;min-width:43px}.settings{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.setting{display:flex;align-items:center;gap:11px;font-size:13px;color:#b9bfd0}.setting input[type=range]{width:150px}.setting strong{color:white;min-width:52px}.settings .spacer{flex:1}.status{font-size:12px;color:#9ba3bc;padding:10px 25px;background:#0b0e17}.note{font-size:12px;color:#8d93a7;line-height:1.5}.mini{font-size:11px;color:#8d93a7}input[type=range]{accent-color:#9b82ff;cursor:pointer}.btn:hover,.filelabel:hover{background:#39425c}@media(max-width:680px){.top,.controls{padding:12px}.viewer{min-height:44vh}.video-wrap{width:125px}.settings{gap:12px}.setting input[type=range]{width:100px}}
</style></head><body><div class="app"><header class="top"><div class="logo">◈ GIF MOSAIC</div><div class="input"><input id="url" placeholder="유튜브 링크를 붙여넣으세요 (https://youtube.com/watch?v=...)"/><button id="load">불러오기</button></div><label class="filelabel">동영상 파일 열기<input id="file" type="file" accept="video/*"></label></header><main id="viewer" class="viewer"><canvas id="screen"></canvas><div id="placeholder" class="placeholder"><h1>영상을 이미지로 그리다.</h1><p>유튜브 링크 또는 로컬 동영상 파일을 넣으세요.<br>업로드한 790개 이미지로 화면을 구성합니다.</p></div><div id="pill" class="pill hidden">● 모자이크 준비 중</div><div id="videoWrap" class="video-wrap hidden"><div id="yt"></div><video id="video" playsinline crossorigin="anonymous"></video></div></main><section class="controls"><div class="seek"><button class="btn" id="play">▶</button><span class="time" id="current">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" step="1"><span class="time" id="duration">0:00</span></div><div class="settings"><label class="setting">🔊 음량 <input id="volume" type="range" min="0" max="100" value="65"><strong id="volumeLabel">65%</strong></label><label class="setting">▦ 이미지 개수 <input id="count" type="range" min="100" max="3000" step="50" value="900"><strong id="countLabel">900개</strong></label><label class="setting">색상 반영 <input id="blend" type="range" min="0" max="100" value="68"><strong id="blendLabel">68%</strong></label><div class="spacer"></div><button class="btn" id="full">⛶ 전체 화면</button></div><p class="note">유튜브: 썸네일을 이용한 정적 색상 모자이크 + 영상/소리/탐색 동기화 · 파일 업로드: 영상 프레임을 실시간으로 분석해 움직이는 모자이크</p></section><footer class="status" id="status">이미지 팔레트 로딩 중...</footer></div><script src="https://www.youtube.com/iframe_api"></script><script src="app.js"></script></body></html>
